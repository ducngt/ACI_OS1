<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#123e36"><title>ACI-OS · NUTE · Bước 1</title><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#203d38;background:#f4f6f3;font-size:15px;line-height:1.6;--green:#123e36;--muted:#60756e;--line:#dce5df;--lime:#daf184}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 16px;background:white;color:var(--green);font-weight:600}button:hover{background:#edf3e8}button.primary{background:var(--green);color:white;border-color:var(--green)}button.primary:hover{background:#205d50}button.danger{color:#a33535}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;padding:11px 12px;background:white;border:1px solid #bbcfc3;border-radius:9px;color:#203d38}textarea{min-height:120px;resize:vertical}label{display:block;font-weight:600;margin:14px 0 6px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(25px,3vw,38px);line-height:1.25;letter-spacing:-1px}h2{font-size:21px;line-height:1.4}h3{font-size:16px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:#728879}.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--green);color:var(--lime);font-size:20px;font-weight:800}.brand strong{font-size:19px;letter-spacing:-.5px}.brand small{display:block;font-size:11px;color:var(--muted)}.notice{padding:8px 24px;background:#fff3d7;color:#795915;text-align:center;font-size:12px}.top{background:white;border-bottom:1px solid var(--line);padding:18px 30px;display:flex;justify-content:space-between;align-items:center;gap:24px}.nav{display:flex;gap:5px;flex-wrap:wrap}.nav button{border:0;background:transparent;font-size:13px}.nav button.active{background:#eaf0e3}.account{font-size:12px;display:flex;align-items:center;gap:10px}.context{background:#ecf1e8;padding:10px 30px;display:flex;gap:24px;align-items:center;font-size:12px}.context select{width:auto;max-width:210px;padding:5px 8px;font-size:12px}.pill{padding:4px 10px;border-radius:20px;background:#eef2e9;font-size:11px;font-weight:700;display:inline-block}.pill.green{color:#276943;background:#e5f3e8}.pill.amber{color:#8d6013;background:#fff0d1}.pill.red{color:#9c3030;background:#fae7e7}.main{max-width:1300px;margin:0 auto;padding:34px 30px 60px}.title-row{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.title-row p{margin-bottom:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:25px}.stat,.card{background:white;border:1px solid var(--line);border-radius:16px}.stat{padding:20px}.stat strong{display:block;font-size:34px;letter-spacing:-1px;margin:7px 0}.stat span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:22px}.card{padding:24px;margin-bottom:20px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.card-head h2{margin:0}.work-row{padding:18px 0;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px}.work-row h3{margin-bottom:4px}.work-row p{margin-bottom:5px;font-size:12px}.work-row button{flex-shrink:0}.hero{background:var(--green);color:white;border-radius:16px;padding:27px;margin-bottom:20px;position:relative;overflow:hidden}.hero .eyebrow{color:var(--lime)}.hero h2{font-size:24px;max-width:360px}.hero p{color:#c1d6cc;font-size:13px}.hero button{background:var(--lime);border-color:var(--lime)}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0}.step{padding:12px 8px;background:#f0f3ed;border-radius:9px;font-size:11px;text-align:center}.step.current{background:var(--green);color:white}.body-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.timeline{border-left:2px solid #d5e2d4;padding-left:17px;margin-left:4px}.timeline p{font-size:12px;margin-bottom:16px}.timeline strong{display:block}.timeline small{color:var(--muted)}.empty{padding:25px 0;color:var(--muted);font-size:14px}.error{padding:14px;background:#fff0e9;color:#923d29;border-radius:10px;margin:12px 0}.check{display:flex;align-items:flex-start;gap:10px;font-weight:400}.check input{width:auto;margin-top:6px}.login{max-width:1100px;margin:70px auto;padding:0 30px;display:grid;grid-template-columns:1.2fr 1fr;gap:65px;align-items:center}.login h1{font-size:49px;margin:30px 0}.login .intro{font-size:17px;color:var(--muted);max-width:490px}.login .card{padding:30px}.feature{display:flex;gap:12px;margin:15px 0;color:var(--muted);font-size:14px}.feature b{color:var(--green)}.footer{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin-top:20px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}.list{padding-left:20px;font-size:14px}.hint{padding:13px 16px;background:#f0f4ea;border-radius:10px;font-size:12px;margin:16px 0}.tag{font-size:11px;color:#6d7d74}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:10px;background:var(--green);color:white;box-shadow:0 5px 25px #0002;display:none;z-index:10;max-width:90vw}.skip{position:absolute;left:-9999px}.skip:focus{left:10px;top:10px;background:white;padding:10px;z-index:100}.help-details{margin:12px 0}summary{cursor:pointer;font-weight:600}a{color:#206453}.status-line{display:flex;align-items:center;gap:10px;font-size:12px}.login header{margin-bottom:30px}@media(max-width:900px){.top{flex-wrap:wrap;padding:16px}.nav{order:3;width:100%}.context{padding:10px 16px;gap:12px;flex-wrap:wrap}.grid,.login{grid-template-columns:1fr}.login{margin-top:35px;gap:20px}.login h1{font-size:36px}.main{padding:25px 16px}.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.title-row{align-items:flex-start}.steps{grid-template-columns:1fr}.account{margin-left:auto}}@media(max-width:480px){.title-row{flex-direction:column}.card{padding:18px}.work-row{align-items:flex-start}.stat{padding:15px}.nav button{padding:8px 9px}}

<script>(function(root){
 'use strict';
 const roles={lecturer:'Giảng viên',student:'Sinh viên',rector:'Hiệu trưởng',admin:'Quản trị hệ thống'};
 const accounts=[{id:'gv-demo',name:'Giảng viên thử nghiệm',roles:['lecturer','rector']},{id:'sv-demo',name:'Sinh viên thử nghiệm',roles:['student']},{id:'admin-demo',name:'Quản trị thử nghiệm',roles:['admin']}];
 const now=()=>new Date().toISOString();
 function initial(){return {schemaVersion:1,revision:0,aiEnabled:true,works:[{id:'CV-001',title:'Thiết kế nhiệm vụ thực hành điều khiển',purpose:'Tạo nhiệm vụ giúp sinh viên giải thích và kiểm thử một mô hình điều khiển.',criteria:'Có mục tiêu, sản phẩm phải nộp, rubric và bằng chứng kiểm thử.',owner:'gv-demo',assignee:'gv-demo',role:'lecturer',deadline:'',status:'requested',plan:null,product:null,evidence:[],feedback:[],history:[{id:'EV-001',time:now(),actor:'Hệ thống thử nghiệm',role:'system',action:'Khởi tạo nhiệm vụ mẫu',version:0}],version:0,acceptance:null}],events:[]};}
 function assert(ok,msg){if(!ok)throw new Error(msg);}
 function authorized(ctx,w){return accounts.some(a=>a.id===ctx.id&&a.roles.includes(ctx.role))&&w.owner===ctx.id&&w.role===ctx.role;}
 function event(state,w,ctx,action){const e={id:'EV-'+(state.events.length+2),time:now(),actor:ctx.id,role:ctx.role,action,version:w?w.version:state.revision};state.events.push(e);if(w)w.history.push(e);}
 function command(state,ctx,type,input={}){
  const s=JSON.parse(JSON.stringify(state));const a=accounts.find(a=>a.id===ctx.id);assert(a&&a.roles.includes(ctx.role),'Vai trò không hợp lệ.');
  if(type==='setAI'){assert(ctx.role==='admin','Chỉ vai trò quản trị được đổi chế độ AI thử nghiệm.');s.aiEnabled=!!input.enabled;s.revision++;event(s,null,ctx,'Đổi chế độ AI: '+s.aiEnabled);return s;}
  if(type==='create'){
   assert(ctx.role==='lecturer'||ctx.role==='rector','Vai trò này không được tạo nhiệm vụ trong bản thử.');
   assert(input.title?.trim()&&input.purpose?.trim()&&input.criteria?.trim(),'Cần nhập tên, mục đích và tiêu chí nghiệm thu.');
   const w={id:'CV-'+String(s.works.length+1).padStart(3,'0'),title:input.title.trim(),purpose:input.purpose.trim(),criteria:input.criteria.trim(),deadline:input.deadline||'',owner:ctx.id,assignee:ctx.id,role:ctx.role,status:'requested',plan:null,product:null,evidence:[],feedback:[],history:[],version:0,acceptance:null};s.works.push(w);event(s,w,ctx,'HUMA tạo yêu cầu');s.revision++;return s;
  }
  const w=s.works.find(w=>w.id===input.id);assert(w,'Không tìm thấy công việc.');assert(authorized(ctx,w),'Không có quyền xử lý công việc trong vai trò hiện hành.');
  if(input.source==='simulated_ai')assert(s.aiEnabled,'Trợ lý đã tắt.');
  if(type==='plan'){
   assert(['requested','changes_requested'].includes(w.status),'Không thể lập kế hoạch ở trạng thái này.');assert(input.text?.trim(),'Kế hoạch không được để trống.');
   w.plan={text:input.text.trim(),source:input.source==='simulated_ai'?'simulated_ai':'human',time:now()};w.status='plan_ready';
  }else if(type==='approvePlan'){
   assert(w.status==='plan_ready','Chưa có kế hoạch cần xác nhận.');w.status='plan_approved';
  }else if(type==='produce'){
   assert(w.status==='plan_approved','HUMA phải xác nhận kế hoạch trước khi tạo sản phẩm.');assert(input.text?.trim(),'Sản phẩm không được để trống.');
   w.version++;w.product={text:input.text.trim(),source:input.source==='simulated_ai'?'simulated_ai':'human',version:w.version,time:now()};w.status='review_ready';w.evidence.push({id:w.id+'-SP-'+w.version,type:'artifact',label:'Bản sản phẩm '+w.version,content:w.product.text,time:now(),source:w.product.source,version:w.version});
  }else if(type==='accept'){
   assert(w.status==='review_ready','Chưa có sản phẩm để nghiệm thu.');assert(input.checked===true,'Cần xác nhận đã đối chiếu sản phẩm với tiêu chí.');assert(input.note?.trim(),'Cần ghi nhận xét nghiệm thu.');
   w.status='accepted';w.acceptance={decision:'approved',reviewer:ctx.id,role:ctx.role,version:w.version,criteria:w.criteria,note:input.note.trim(),time:now()};w.evidence.push({id:w.id+'-NT-'+w.version,type:'human_review',label:'Biên bản nghiệm thu thử nghiệm',content:w.acceptance.note,time:now(),source:'human',version:w.version});
  }else if(type==='revise'){
   assert(w.status==='review_ready','Chưa có sản phẩm để yêu cầu sửa.');assert(input.note?.trim(),'Cần mô tả điều muốn sửa.');w.feedback.push({text:input.note.trim(),version:w.version,time:now()});w.status='changes_requested';
  }else if(type==='reject'){
   assert(['plan_ready','review_ready'].includes(w.status),'Không thể bác bỏ ở trạng thái này.');assert(input.note?.trim(),'Cần ghi lý do bác bỏ.');w.feedback.push({text:input.note.trim(),version:w.version,time:now()});w.status='rejected';
  }else throw new Error('Thao tác không được hỗ trợ.');
  event(s,w,ctx,({plan:'Tạo kế hoạch',approvePlan:'HUMA xác nhận kế hoạch',produce:'Tạo sản phẩm',accept:'HUMA nghiệm thu',revise:'HUMA yêu cầu sửa',reject:'HUMA bác bỏ'})[type]);s.revision++;return s;
 }
 function visible(state,ctx){return state.works.filter(w=>authorized(ctx,w));}
 const api={roles,accounts,initial,command,visible,authorized};root.ACICore=api;if(typeof module!=='undefined')module.exports=api;
})(typeof window==='undefined'?globalThis:window);
</script><script>(()=>{
 'use strict';
 const C=window.ACICore, KEY='aci-os-nute-step1-v1';let state,ctx=null,page='dashboard',selected=null,error='',memoryAvailable=true;
 const statuses={requested:'Chờ lập kế hoạch',plan_ready:'Chờ HUMA xác nhận',plan_approved:'Kế hoạch đã xác nhận',review_ready:'Chờ nghiệm thu',changes_requested:'Cần sửa',accepted:'Đã nghiệm thu',rejected:'Đã bác bỏ'};
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const date=t=>new Date(t).toLocaleString('vi-VN');const $=s=>document.querySelector(s);const user=()=>C.accounts.find(a=>a.id===ctx?.id);
 function load(){try{const raw=localStorage.getItem(KEY);state=raw?JSON.parse(raw):C.initial();if(state.schemaVersion!==1||!Array.isArray(state.works))throw new Error('Invalid state');}catch(e){state=C.initial();error='Không đọc được dữ liệu đã lưu. Đang dùng dữ liệu mẫu mới; bản lưu cũ chưa bị ghi đè.';memoryAvailable=false;}}
 function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));}catch(e){memoryAvailable=false;throw new Error('Không lưu được dữ liệu. Thao tác chưa hoàn tất; hãy cho phép lưu trữ trong trình duyệt.');}state=next;memoryAvailable=true;}
 function run(type,input){try{persist(C.command(state,ctx,type,input));error='';render();toast('Đã ghi nhận thao tác trong bản thử nghiệm.');return true;}catch(e){error=e.message;let alert=$('#action-error');if(!alert){alert=document.createElement('div');alert.id='action-error';alert.className='error';alert.setAttribute('role','alert');$('#main').prepend(alert);}alert.textContent=error;alert.scrollIntoView({block:'nearest'});return false;}}
 function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',4000);}
 function badge(w){return `<span class="pill ${w.status==='accepted'?'green':w.status==='rejected'?'red':'amber'}">${esc(statuses[w.status])}</span>`;}
 const btn=(label,action,kind='',id='')=>`<button class="${kind}" data-action="${action}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`;
 function shell(content){return `<div class="notice">BƯỚC 1 · BẢN THỬ NGHIỆM — Tài khoản và trợ lý mô phỏng. Chỉ dùng dữ liệu mẫu.</div><header class="top"><div class="brand"><div class="mark">A</div><div><strong>ACI-OS</strong><small>NUTE / HUMAN + AI</small></div></div><nav class="nav" aria-label="Điều hướng">${[['dashboard','Tổng quan'],['work','Công việc'],['catalog','Năng lực'],['ai','Trợ lý'],['history','Lịch sử'],['help','Hướng dẫn']].map(([p,l])=>`<button data-page="${p}" class="${page===p?'active':''}">${l}</button>`).join('')}</nav><div class="account"><span>${esc(user().name)}</span>${btn('Thoát','logout')}</div></header><div class="context"><span>Vai trò hiện hành</span><select id="role" aria-label="Vai trò hiện hành">${user().roles.map(r=>`<option value="${r}" ${r===ctx.role?'selected':''}>${C.roles[r]}</option>`).join('')}</select><span>Phạm vi: công việc của vai trò này</span><span class="pill ${state.aiEnabled?'green':'amber'}">Trợ lý mô phỏng ${state.aiEnabled?'đang bật':'đã tắt'}</span></div><main class="main" id="main">${error?`<div class="error" role="alert">${esc(error)}</div>`:''}${!memoryAvailable?'<div class="error">Chưa xác nhận khả năng lưu dữ liệu trên trình duyệt này.</div>':''}${content}<footer class="footer">ACI-OS NUTE · Phiên bản 0.1.0 · Lưu trên trình duyệt hiện tại; không chia sẻ giữa người dùng/máy tính. Không phải hệ thống production.</footer></main>`;}
 function login(){return `<div class="notice">Bản thử nghiệm tương tác · Chưa có đăng nhập thật hoặc AI thật</div><main class="login" id="main"><section><div class="brand"><div class="mark">A</div><div><strong>ACI-OS</strong><small>ĐẠI HỌC SƯ PHẠM KỸ THUẬT NAM ĐỊNH</small></div></div><div class="eyebrow" style="margin-top:45px">Bước 1 / Không gian làm việc</div><h1>Con người quyết định.<br>AI hỗ trợ thực hiện.</h1><p class="intro">Một nơi để giao việc, kiểm tra sản phẩm và ghi nhận quyết định có bằng chứng.</p><div class="feature"><b>01</b> Chọn đúng vai trò và trách nhiệm</div><div class="feature"><b>02</b> Xác nhận kế hoạch trước khi thực hiện</div><div class="feature"><b>03</b> Nghiệm thu sản phẩm, giữ lại lịch sử</div></section><section class="card"><div class="eyebrow">Bắt đầu trải nghiệm</div><h2 style="margin-top:12px">Chọn tài khoản thử nghiệm</h2><p class="muted">Không cần mật khẩu. Các tài khoản dưới đây chỉ mô phỏng vai trò; không chứng minh danh tính.</p><form id="login-form"><label for="account">Tài khoản</label><select id="account">${C.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select><label class="check"><input type="checkbox" id="demo-consent" required><span>Tôi sử dụng dữ liệu mẫu và hiểu đây là bản thử nghiệm.</span></label><button class="primary" type="submit" style="width:100%;margin-top:16px">Mở không gian làm việc →</button></form><div class="hint">Thử tài khoản Giảng viên để đi hết luồng. Chuyển sang Hiệu trưởng để kiểm tra việc tách ngữ cảnh. Dùng Quản trị để tắt trợ lý.</div>${error?`<div class="error">${esc(error)}</div>`:''}</section></main>`;}
 function rows(ws){return ws.length?ws.map(w=>`<article class="work-row"><div><p class="tag">${esc(w.id)} · ${C.roles[w.role]} · Bản ${w.version}</p><h3>${esc(w.title)}</h3>${badge(w)}${w.deadline?`<p class="muted">Hạn: ${esc(w.deadline)}</p>`:''}</div>${btn('Mở →','open','',w.id)}</article>`).join(''):'<div class="empty">Chưa có công việc thuộc vai trò này.</div>';}
 function dashboard(){const ws=C.visible(state,ctx),accepted=ws.filter(w=>w.status==='accepted').length,pending=ws.filter(w=>['plan_ready','review_ready'].includes(w.status)).length;
  if(ctx.role==='admin')return `<div class="title-row"><div><div class="eyebrow">Vận hành / Bước 1</div><h1>Quản trị bản thử nghiệm</h1><p class="muted">Kiểm tra chế độ hoạt động và khả năng lưu trên trình duyệt.</p></div><span class="pill amber">Chưa kết nối máy chủ</span></div><div class="grid"><section class="card"><h2>Chế độ trợ lý</h2><p>Trợ lý dùng mẫu nội dung cố định để minh họa luồng. Khi tắt, HUMA vẫn có thể nhập kế hoạch và sản phẩm thủ công.</p>${btn(state.aiEnabled?'Tắt trợ lý mô phỏng':'Bật trợ lý mô phỏng','toggleAI','primary')}<div class="hint">Thay đổi này chỉ tác động bản thử trên trình duyệt này. AI không được tự cấp quyền hoặc tự nghiệm thu.</div></section><section class="card"><h2>Trạng thái</h2><p>Phiên bản dữ liệu: ${state.revision}</p><p>Lưu cục bộ: ${memoryAvailable?'Sẵn sàng':'Cần kiểm tra'}</p><p>Đăng nhập thật: Chưa có</p><p>Kiểm chứng độc lập: Chưa có</p></section></div>`;
  return `<div class="title-row"><div><div class="eyebrow">Không gian ${ctx.role==='rector'?'điều hành':'làm việc'} / Bước 1</div><h1>${ctx.role==='rector'?'Việc cần quyết định':'Công việc rõ ràng. Quyết định có căn cứ.'}</h1><p class="muted">${ctx.role==='student'?'Không có nhiệm vụ được giao cho sinh viên trong vòng thử này.':'Theo dõi đúng công việc thuộc vai trò hiện hành của bạn.'}</p></div>${ctx.role!=='student'?btn('+ Tạo yêu cầu','new','primary'):''}</div><div class="stats">${[['Công việc trong phạm vi',ws.length,'Theo vai trò hiện hành'],['Chờ quyết định',pending,'Kế hoạch hoặc nghiệm thu'],['Đã nghiệm thu',accepted,'HUMA đã xác nhận'],['Bằng chứng sản phẩm',ws.reduce((n,w)=>n+w.evidence.length,0),'Chưa kiểm chứng độc lập']].map(([l,n,d])=>`<div class="stat"><span>${l}</span><strong>${n}</strong><span>${d}</span></div>`).join('')}</div><div class="grid"><section class="card"><div class="card-head"><h2>${ctx.role==='rector'?'Hồ sơ trong thẩm quyền':'Công việc của bạn'}</h2><span class="tag">${ws.length} công việc</span></div>${rows(ws)}</section><aside><section class="hero"><div class="eyebrow">HUMA + AI</div><h2>Bạn giữ mục đích.<br>Bạn xác nhận kết quả.</h2><p>Trợ lý có thể đề xuất kế hoạch và tạo dự thảo. Quyết định nghiệm thu luôn thuộc HUMA.</p>${btn('Xem cách thử →','help')}</section><section class="card"><h3>Phạm vi bước 1</h3><p class="muted">Giao yêu cầu, xác nhận kế hoạch, tạo sản phẩm, yêu cầu sửa và nghiệm thu. Dữ liệu nền chính thức thuộc bước 2.</p><span class="pill">Dữ liệu mẫu</span></section></aside></div>`;
 }
 function newWork(){return `<div class="title-row"><div><div class="eyebrow">HUMA / Xác lập mục đích</div><h1>Tạo yêu cầu công việc</h1></div>${btn('← Công việc','work')}</div><section class="card"><form id="create-form"><label for="title">Tên công việc</label><input id="title" maxlength="180" required placeholder="Ví dụ: Thiết kế một nhiệm vụ thực hành"><label for="purpose">Mục đích và kết quả mong muốn</label><textarea id="purpose" maxlength="6000" required></textarea><label for="criteria">Tiêu chí nghiệm thu và điều bắt buộc</label><textarea id="criteria" maxlength="6000" required placeholder="HUMA sẽ đối chiếu sản phẩm với các tiêu chí này."></textarea><label for="deadline">Thời hạn dự kiến</label><input id="deadline" type="date"><div class="hint">Trong bước 1, người tạo cũng là người phụ trách và nghiệm thu. Giao việc cho người khác và phân tách trách nhiệm sẽ cần đặc tả tiếp theo.</div><button class="primary" type="submit">Tạo công việc</button></form></section>`;}
 function detail(){const w=state.works.find(w=>w.id===selected);if(!w||!C.authorized(ctx,w))return '<section class="card"><h1>Không có quyền xem</h1><p>Hãy quay lại danh sách công việc của vai trò hiện hành.</p></section>';
  const idx={requested:0,changes_requested:0,plan_ready:1,plan_approved:2,review_ready:3,accepted:4,rejected:4}[w.status];
  let area='';if(['requested','changes_requested'].includes(w.status))area=`<h2>Lập kế hoạch</h2><p class="muted">Đọc yêu cầu và phản hồi trước khi đề xuất cách thực hiện.</p>${state.aiEnabled?btn('Trợ lý mô phỏng đề xuất kế hoạch','simulatePlan','primary'): '<div class="hint">Trợ lý đã tắt. Bạn có thể nhập kế hoạch thủ công.</div>'}<form id="plan-form"><label for="plan-text">Kế hoạch do HUMA nhập</label><textarea id="plan-text" required maxlength="12000"></textarea><button type="submit">Lưu kế hoạch để xác nhận</button></form>`;
  if(w.status==='plan_ready')area=`<h2>HUMA xác nhận kế hoạch</h2><div class="hint">Nguồn: ${w.plan.source==='human'?'HUMA nhập':'Trợ lý mô phỏng / mẫu cố định'}. Chưa thực hiện công việc.</div><div class="body-text">${esc(w.plan.text)}</div><div class="actions">${btn('Xác nhận kế hoạch','approvePlan','primary')}${btn('Bác bỏ kế hoạch','showReject','danger')}</div><form id="reject-form" hidden><label for="reject-note">Lý do bác bỏ</label><textarea id="reject-note" required></textarea><button type="submit" class="danger">Ghi quyết định bác bỏ</button></form>`;
  if(w.status==='plan_approved')area=`<h2>Tạo sản phẩm theo kế hoạch</h2><details class="help-details"><summary>Kế hoạch đã xác nhận</summary><div class="body-text">${esc(w.plan.text)}</div></details>${state.aiEnabled?btn('Trợ lý mô phỏng tạo dự thảo','simulateProduct','primary'):'<div class="hint">Trợ lý đã tắt. Bạn có thể nhập sản phẩm thủ công.</div>'}<form id="product-form"><label for="product-text">Nội dung sản phẩm do HUMA nhập</label><textarea id="product-text" required maxlength="20000"></textarea><button type="submit">Lưu sản phẩm và chuyển nghiệm thu</button></form>`;
  if(w.status==='review_ready')area=`<h2>Kiểm tra sản phẩm · Bản ${w.version}</h2><div class="hint">Nguồn: ${w.product.source==='human'?'HUMA nhập':'Trợ lý mô phỏng / mẫu cố định'}. Chưa có kiểm chứng độc lập. Không phải kết quả chính thức của Nhà trường.</div><div class="body-text">${esc(w.product.text)}</div><form id="review-form"><label for="review-note">Nhận xét / nội dung cần sửa / lý do bác bỏ</label><textarea id="review-note" required maxlength="6000"></textarea><label class="check"><input type="checkbox" id="review-checked"><span>Tôi đã đối chiếu sản phẩm với tiêu chí nghiệm thu.</span></label><div class="actions"><button type="submit" name="decision" value="accept" class="primary">Nghiệm thu bản này</button><button type="submit" name="decision" value="revise">Yêu cầu sửa</button><button type="submit" name="decision" value="reject" class="danger">Bác bỏ</button></div></form>`;
  if(['accepted','rejected'].includes(w.status))area=`<h2>${w.status==='accepted'?'Nghiệm thu đã được ghi nhận':'Công việc đã bị bác bỏ'}</h2>${w.product?`<div class="body-text">${esc(w.product.text)}</div>`:''}${w.acceptance?`<div class="hint">Người nghiệm thu: ${esc(w.acceptance.reviewer)} · ${C.roles[w.acceptance.role]}<br>Bản: ${w.acceptance.version} · ${date(w.acceptance.time)}<br>${esc(w.acceptance.note)}</div>`:''}<p class="muted">Quyết định chỉ có giá trị trong thử nghiệm. Bằng chứng và lịch sử vẫn được giữ lại.</p>`;
  return `<div class="title-row"><div><div class="eyebrow">${esc(w.id)} / ${C.roles[w.role]}</div><h1>${esc(w.title)}</h1>${badge(w)}</div>${btn('← Công việc','work')}</div><div class="steps">${['Yêu cầu','Xác nhận kế hoạch','Thực hiện','Nghiệm thu','Ghi nhận'].map((l,i)=>`<div class="step ${i===idx?'current':''}">${i+1}. ${l}</div>`).join('')}</div><div class="grid"><section><div class="card"><h3>Mục đích</h3><p class="body-text">${esc(w.purpose)}</p><h3>Tiêu chí nghiệm thu</h3><p class="body-text">${esc(w.criteria)}</p>${w.feedback.length?`<h3>Phản hồi đã ghi nhận</h3>${w.feedback.map(f=>`<p class="body-text">Bản ${f.version}: ${esc(f.text)}</p>`).join('')}`:''}</div><div class="card">${area}</div></section><aside><section class="card"><h2>Bằng chứng</h2>${w.evidence.length?w.evidence.map(e=>`<details class="help-details"><summary>${esc(e.label)}</summary><p class="tag">${esc(e.id)} · ${date(e.time)}</p><div class="body-text">${esc(e.content)}</div></details>`).join(''):'<p class="muted">Chưa có bằng chứng sản phẩm.</p>'}<div class="hint">Bản ghi cục bộ có thể bị người dùng trình duyệt sửa. Chưa có chữ ký số hoặc chống sửa đổi.</div></section><section class="card"><h2>Lịch sử công việc</h2><div class="timeline">${w.history.slice().reverse().map(e=>`<p><strong>${esc(e.action)}</strong><small>${date(e.time)}<br>${esc(e.actor)} · ${esc(C.roles[e.role]||e.role)}</small></p>`).join('')}</div></section></aside></div>`;
 }
 function catalog(){const entries=[['Tạo yêu cầu','HUMA xác lập mục đích và tiêu chí',['lecturer','rector']],['Xác nhận kế hoạch','HUMA quyết định trước khi thực hiện',['lecturer','rector']],['Tạo dự thảo','Trợ lý mô phỏng hoặc HUMA nhập',['lecturer','rector']],['Nghiệm thu','HUMA xem sản phẩm và bằng chứng',['lecturer','rector']],['Chế độ trợ lý','Quản trị bật/tắt trợ lý mô phỏng',['admin']]];return `<div class="title-row"><div><div class="eyebrow">Năng lực / Vai trò hiện hành</div><h1>Những việc bạn có thể làm</h1></div></div><div class="split">${entries.filter(e=>e[2].includes(ctx.role)).map(e=>`<section class="card"><span class="pill">Bước 1</span><h2 style="margin-top:12px">${e[0]}</h2><p class="muted">${e[1]}</p></section>`).join('')||'<section class="card"><p>Chưa có chức năng nghiệp vụ sinh viên trong vòng thử này.</p></section>'}</div><p class="muted">Danh mục được lọc theo vai trò; bản production phải kiểm tra quyền tại máy chủ cho từng hành động.</p>`;}
 function ai(){return `<div class="title-row"><div><div class="eyebrow">Hỗ trợ / Không có kết nối AI thật</div><h1>Trợ lý theo công việc</h1><p class="muted">Chọn một công việc để lập kế hoạch hoặc tạo dự thảo mẫu.</p></div></div><section class="card"><div class="hint">Không phải chatbot LLM. Nội dung được sinh từ mẫu cố định và dữ liệu yêu cầu, không gửi ra ngoài trình duyệt. AI thật sẽ cần gateway, xác thực, quản lý dữ liệu và giới hạn công cụ.</div>${rows(C.visible(state,ctx).filter(w=>!['accepted','rejected'].includes(w.status)))}</section>`;}
 function history(){const ws=C.visible(state,ctx);return `<div class="title-row"><div><div class="eyebrow">Truy nguyên / Theo phạm vi</div><h1>Lịch sử và kết quả</h1></div>${btn('Xuất hồ sơ thử nghiệm','export')}</div><section class="card">${ws.flatMap(w=>w.history.map(e=>({...e,work:w.title}))).reverse().map(e=>`<article class="work-row"><div><h3>${esc(e.action)}</h3><p>${esc(e.work)}</p><p class="muted">${date(e.time)} · ${esc(e.actor)} · ${esc(C.roles[e.role]||e.role)}</p></div><span class="pill">Bản ${e.version}</span></article>`).join('')||'<p class="muted">Chưa có lịch sử công việc trong phạm vi này.</p>'}</section>`;}
 function help(){return `<div class="title-row"><div><div class="eyebrow">Dành cho người không biết code</div><h1>Thử hệ thống bằng vài lần nhấp</h1></div></div><div class="grid"><section class="card"><h2>Đi hết một vòng HUMA + AI</h2><ol class="list"><li>Chọn tài khoản Giảng viên thử nghiệm.</li><li>Mở công việc mẫu hoặc chọn <b>Tạo yêu cầu</b>.</li><li>Chọn <b>Trợ lý mô phỏng đề xuất kế hoạch</b>, hoặc tự nhập kế hoạch.</li><li>Đọc rồi chọn <b>Xác nhận kế hoạch</b>.</li><li>Tạo dự thảo hoặc nhập sản phẩm thủ công.</li><li>Đối chiếu với tiêu chí, ghi nhận xét và chọn <b>Nghiệm thu bản này</b>.</li><li>Mở <b>Lịch sử</b> để kiểm tra quyết định và phiên bản.</li></ol><h3>Thử yêu cầu sửa</h3><p>Ở màn hình nghiệm thu, nhập nội dung cần sửa và chọn <b>Yêu cầu sửa</b>. Kế hoạch phải được xác nhận lại. Bản sản phẩm cũ vẫn nằm trong bằng chứng.</p><h3>Thử khi trợ lý tắt</h3><p>Thoát, chọn tài khoản Quản trị, tắt trợ lý, rồi trở lại Giảng viên. Nhập kế hoạch và sản phẩm thủ công để hoàn thành công việc.</p></section><aside><section class="card"><h2>Giới hạn cần biết</h2><ul class="list"><li>Không có đăng nhập thật.</li><li>Không có phân quyền máy chủ.</li><li>Không có kết nối AI thật.</li><li>Không có dữ liệu dùng chung nhiều người.</li><li>Không có chữ ký số hoặc kiểm chứng độc lập.</li><li>Xóa dữ liệu trình duyệt sẽ mất bản lưu.</li></ul><p>Không nhập dữ liệu sinh viên, nhân sự, điểm, mật khẩu hoặc tài liệu nội bộ thật.</p></section><section class="card"><h3>Mở và chạy</h3><p>Mở <b>index.html</b> sau khi giải nén, hoặc dùng đường dẫn GitHub Pages sau khi người quản trị xuất bản. Hướng dẫn GitHub nằm trong <b>HUONG_DAN.html</b>.</p></section></aside></div>`;}
 function render(){const content=!ctx?login():shell(page==='dashboard'?dashboard():page==='new'?newWork():page==='detail'?detail():page==='catalog'?catalog():page==='ai'?ai():page==='history'?history():page==='help'?help():`<div class="title-row"><div><div class="eyebrow">Danh sách / Trong phạm vi</div><h1>Công việc</h1></div>${['lecturer','rector'].includes(ctx.role)?btn('+ Tạo yêu cầu','new','primary'):''}</div><section class="card">${rows(C.visible(state,ctx))}</section>`);$('#app').innerHTML=content;bind();}
 function navigate(p){page=p;selected=p==='detail'?selected:null;error='';render();window.scrollTo(0,0);}
 function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));if($('#role'))$('#role').onchange=e=>{ctx.role=e.target.value;navigate('dashboard');};
  if($('#login-form'))$('#login-form').onsubmit=e=>{e.preventDefault();const a=C.accounts.find(a=>a.id===$('#account').value);ctx={id:a.id,role:a.roles[0]};navigate('dashboard');};
  if($('#create-form'))$('#create-form').onsubmit=e=>{e.preventDefault();const input={title:$('#title').value,purpose:$('#purpose').value,criteria:$('#criteria').value,deadline:$('#deadline').value};if(run('create',input)){selected=state.works.at(-1).id;navigate('detail');}};
  if($('#plan-form'))$('#plan-form').onsubmit=e=>{e.preventDefault();run('plan',{id:selected,text:$('#plan-text').value,source:'human'});};
  if($('#product-form'))$('#product-form').onsubmit=e=>{e.preventDefault();run('produce',{id:selected,text:$('#product-text').value,source:'human'});};
  if($('#review-form'))$('#review-form').onsubmit=e=>{e.preventDefault();run(e.submitter.value,{id:selected,note:$('#review-note').value,checked:$('#review-checked').checked});};
  if($('#reject-form'))$('#reject-form').onsubmit=e=>{e.preventDefault();run('reject',{id:selected,note:$('#reject-note').value});};
 }
 function action(a,id){const w=state.works.find(w=>w.id===selected);
  if(a==='open'){selected=id;navigate('detail');}else if(['new','work','help'].includes(a))navigate(a);else if(a==='logout'){ctx=null;selected=null;page='dashboard';error='';render();}else if(a==='toggleAI')run('setAI',{enabled:!state.aiEnabled});else if(a==='showReject')$('#reject-form').hidden=false;
  else if(a==='approvePlan')run('approvePlan',{id:selected});else if(a==='simulatePlan'){if(!state.aiEnabled){toast('Trợ lý đã tắt.');return;}run('plan',{id:selected,source:'simulated_ai',text:`KẾ HOẠCH MẪU — cần HUMA kiểm tra\n\n1. Đối chiếu mục đích: ${w.purpose}\n2. Chuẩn bị sản phẩm theo tiêu chí: ${w.criteria}\n3. Ghi lại nguồn, giả định và kết quả kiểm tra.\n4. Trình HUMA xem sản phẩm, bằng chứng và hạn chế.\n\n${w.feedback.length?'Phản hồi cần xử lý: '+w.feedback.at(-1).text:'Chưa có phản hồi sửa đổi.'}\n\nĐây là mẫu cố định, không phải phân tích bởi mô hình AI.`});}
  else if(a==='simulateProduct'){if(!state.aiEnabled){toast('Trợ lý đã tắt.');return;}run('produce',{id:selected,source:'simulated_ai',text:`DỰ THẢO MẪU: ${w.title}\n\nMục đích\n${w.purpose}\n\nTiêu chí do HUMA xác lập\n${w.criteria}\n\nCấu trúc sản phẩm đề xuất\n• Mô tả vấn đề và điều kiện thực hiện.\n• Phương án giải quyết và lý do lựa chọn.\n• Sản phẩm thực hành hoặc mô phỏng.\n• Bảng kết quả kiểm thử và giải thích sai lệch.\n• Nhận xét, hạn chế và bước cải tiến.\n\n${w.feedback.length?'Nội dung cần bổ sung theo phản hồi: '+w.feedback.at(-1).text+'\n\n':''}Hạn chế: chưa có dữ liệu thực nghiệm hoặc nguồn chuyên môn; các phần trên chỉ là cấu trúc mẫu. HUMA cần sửa hoặc bác bỏ nếu không đáp ứng yêu cầu.\n\nNguồn: mẫu minh họa trong bản thử nghiệm ACI-OS bước 1.`});}
  else if(a==='export'){const payload={kind:'aci-os-demo-export',schemaVersion:1,exportedAt:new Date().toISOString(),scope:ctx,works:C.visible(state,ctx),notice:'Dữ liệu thử; không có chữ ký số hoặc kiểm chứng độc lập.'};const u=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=u;link.download='ACI_OS1-ho-so-thu-nghiem.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
 }
 load();render();
})();
</script></body></html>
