function canRead(actor,w){const a=getAccount(actor);if(!a)return false;
 if(w.privateLearner)return a.id===w.owner||(a.role==='department'&&a.unit===w.unit);
 if(w.owner===a.id||w.assignedTo===a.id)return true;
 if(a.role==='admin')return w.kind==='technical'&&w.unit==='platform';
 if(['student','business','parent'].includes(a.role))return false;
 if(w.kind==='technical')return false;
 if(a.role==='rector')return true;
 if(a.role==='vice_rector')return w.portfolio==='academic'&&['academic','faculty','teaching','processing'].includes(w.kind);
 if(a.role==='dean')return [a.unit,'dept-a1'].includes(w.unit)&&['faculty','teaching','processing'].includes(w.kind);

function actions(actor,w){const a=getAccount(actor);if(!a||!canRead(actor,w))return [];

 if(editable&&(w.owner===a.id||w.assignedTo===a.id))out.push('edit','submit');

  if(['rector','vice_rector','dean'].includes(a.role)||(a.role==='department'&&w.privateLearner))out.push('approve','requestChanges','reject');

 if(editable&&a.role==='admin'&&w.kind==='technical')out.push('complete');

  const kinds={rector:'directive',vice_rector:'academic',dean:'faculty',vice_dean:'teaching',specialist:'processing',department:'teaching',student:'learning',business:'partnership',parent:'support'};
  const w={id:'CV-'+String(s.works.length+1).padStart(3,'0'),title:input.title.trim(),titleKey:'',purpose:input.purpose.trim(),purposeKey:'',criteria:input.criteria.trim(),criteriaKey:'',kind:kinds[a.role],unit:a.unit,portfolio:'academic',owner:actor,assignedTo:actor,status:'draft',deadline:input.deadline||'',privateLearner:a.role==='student',version:0,product:null,evidence:[],feedback:[],history:[],decisions:[]};s.works.push(w);log(s,actor,'created',w);

   w.version++;w.product={text:input.text.trim(),source:input.source==='template'?'template':'human',version:w.version,time:now()};w.evidence.push({...w.product,type:'artifact'});w.status='in_progress';log(s,actor,'edited',w);
  }else if(type==='submit'){assert(w.product,'mustProduct');w.status='submitted';log(s,actor,'submit',w);}
  else if(type==='comment'){assert(input.note?.trim(),'mustNote');w.feedback.push({text:input.note.trim(),actor,time:now(),version:w.version});log(s,actor,'commented',w);}

function denied(){return `<section class="panel"><h1>${esc(t('noAccess'))}</h1><div class="actions">${button('back','go',cfg().home)}</div></section>`;}
function table(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th scope="col">${esc(t(h))}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}">${esc(t('empty'))}</td></tr>`}</tbody></table></div>`;}
function accountsView(){return heading('accounts')+`<section class="panel"><div class="note">${esc(t('roleFixed'))}</div>${table(['user','role','scope'],C.accounts.map(a=>[esc(a.id),esc(t(a.role)),esc(t(a.scopeKey))]))}</section><section class="panel"><h2>${esc(t('permissionProposal'))}</h2><div class="note">${esc(t('proposalNote'))}</div><form id="proposal-form"><div class="form-grid"><div><label for="proposal-target">${esc(t('targetAccount'))}</label><select id="proposal-target">${C.accounts.filter(a=>a.id!==actor).map(a=>`<option value="${a.id}">${esc(a.id)}</option>`).join('')}</select></div><div><label for="proposal-role">${esc(t('proposedRole'))}</label><select id="proposal-role">${Object.keys(C.roleConfig).map(r=>`<option value="${r}">${esc(t(r))}</option>`).join('')}</select></div></div><label for="proposal-reason">${esc(t('reason'))}</label><textarea id="proposal-reason" maxlength="6000" required></textarea><button type="submit" style="margin-top:12px">${esc(t('requestAuthority'))}</button></form></section>`;}
function matrix(){return heading('permissions')+`<section class="panel"><div class="note">${esc(t('roleMatrixNote'))}</div>${table(['role','capability','scope'],Object.entries(C.roleConfig).map(([r,v])=>[esc(t(r)),esc(v.modules.map(m=>t(m)).join(' · ')),esc(t(C.accounts.find(a=>a.role===r).scopeKey))]))}</section>`;}
function organization(){return heading('organization')+`<section class="panel"><div class="note">${esc(t('syntheticOrg'))}</div>${table(['unit','parentUnit','status'],state.organization.map(o=>[esc(o.name||t(o.nameKey)),esc(o.parent?(state.organization.find(p=>p.id===o.parent)?.name||t(state.organization.find(p=>p.id===o.parent)?.nameKey)):t('none')),badge(o.status)]))}</section><section class="panel"><h2>${esc(t('registerUnit'))}</h2><form id="unit-form"><label for="unit-name">${esc(t('unitName'))}</label><input id="unit-name" required maxlength="180"><label for="unit-parent">${esc(t('parentUnit'))}</label><select id="unit-parent">${state.organization.map(o=>`<option value="${esc(o.id)}">${esc(o.name||t(o.nameKey))}</option>`).join('')}</select><div class="note">${esc(t('unitDraftNote'))}</div><button type="submit">${esc(t('save'))}</button></form></section>`;}
function sources(){return heading('sources')+`<section class="panel">${table(['sourceName','sourceOwner','authority','status'],state.sources.map(s=>[esc(s.name),esc(s.owner),esc(s.authority)||esc(t('notValidated')),badge(s.status)]))}</section><section class="panel"><h2>${esc(t('createSource'))}</h2><form id="source-form"><div class="form-grid"><div><label for="source-name">${esc(t('sourceName'))}</label><input id="source-name" maxlength="180" required></div><div><label for="source-owner">${esc(t('sourceOwner'))}</label><input id="source-owner" maxlength="180" required></div></div><label for="source-authority">${esc(t('authority'))}</label><textarea id="source-authority" maxlength="6000"></textarea><div class="note">${esc(t('sourceRegistered'))}</div><button type="submit">${esc(t('createSource'))}</button></form></section>`;}
function agents(){return heading('agents')+`<section class="panel">${table(['agentName','status','tools'],[['Preview Assistant',badge(state.config.assistantEnabled?'enabled':'disabled'),esc(t('simulation'))]])}<div class="note">${esc(t('agentLimits'))}</div><div class="actions">${button('settings','go','settings')}</div></section>`;}
function settings(){return heading('settings')+`<section class="panel"><form id="settings-form"><div class="form-grid"><div><label for="default-language">${esc(t('prefLanguage'))}</label><select id="default-language">${Object.entries(I.langs).map(([k,v])=>`<option value="${k}" ${state.config.language===k?'selected':''}>${v}</option>`).join('')}</select></div><div><label for="assistant-mode">${esc(t('assistantMode'))}</label><select id="assistant-mode"><option value="on" ${state.config.assistantEnabled?'selected':''}>${esc(t('enabled'))}</option><option value="off" ${!state.config.assistantEnabled?'selected':''}>${esc(t('disabled'))}</option></select></div></div><div class="note">${esc(t('configExplanation'))}</div><button type="submit" class="primary">${esc(t('configDraft'))}</button></form></section>`;}
function changes(){const a=account();return heading('changes')+`<section class="panel"><h2>${esc(t('changes'))}</h2>${table(['recordLabel','prefLanguage','assistantMode','status','action'],state.changes.map(c=>[esc(c.id),esc(I.langs[c.language]),esc(t(c.assistantEnabled?'enabled':'disabled')),badge(c.status),a.role==='admin'&&c.status==='pendingConfig'?button('apply','applyConfig',c.id,'primary'):'—']))}</section><section class="panel"><h2>${esc(t('permissionProposal'))}</h2><div class="note">${esc(t('proposalNote'))}</div>${table(['targetAccount','proposedRole','reason','status'],state.proposals.map(p=>[esc(p.target),esc(t(p.role)),esc(p.reason),badge(p.status)]))}</section>`;}
function incidents(){return heading('incidents')+`<section class="panel"><h2>${esc(t('incidents'))}</h2>${table(['recordLabel','incidentName','status'],state.incidents.map(i=>[esc(i.id),esc(i.text),badge(i.status)]))}<form id="incident-form"><label for="incident-text">${esc(t('incidentName'))}</label><textarea id="incident-text" maxlength="6000" required></textarea><button type="submit" style="margin-top:12px">${esc(t('reportIncident'))}</button></form></section><section class="panel"><h2>${esc(t('backup'))}</h2><div class="note">${esc(t('backupNote'))}</div>${button('backup','backup')}</section>`;}
function history(){const all=page==='audit'&&account().role==='admin'?state.audit:C.visible(state,actor).flatMap(w=>w.history);return heading(page,'',button('exportScope','export'))+`<section class="panel"><div class="note">${esc(t('demoAudit'))}</div>${table(['date','actor','action','recordLabel'],all.slice().reverse().map(e=>[esc(date(e.time)),esc(e.actor),esc(t(e.action)),esc(e.object||'—')]))}</section>`;}
function sharedInfo(){const g=C.shared(state,actor);if(!g)return heading('sharedInfo')+`<section class="panel"><p>${esc(t('parentNoLink'))}</p></section>`;return heading('sharedInfo')+`<section class="panel"><div class="note">${esc(t('parentConsent'))}</div><p>${esc(t('studentLabel'))}: ${esc(g.student)}</p>${g.fields.includes('schedule')?`<div class="row"><div><h3>${esc(t('schedule'))}</h3><p>${esc(t('practiceSession'))}</p></div></div>`:''}${g.fields.includes('notifications')?`<div class="row"><div><h3>${esc(t('notifications'))}</h3><p>${esc(t('noticeSample'))}</p></div></div>`:''}</section>`;}
function notifications(){if(account().role==='parent'&&!C.shared(state,actor))return heading('notifications')+`<section class="panel">${esc(t('parentNoLink'))}</section>`;if(account().role==='parent'&&!C.shared(state,actor).fields.includes('notifications'))return heading('notifications')+`<section class="panel">${esc(t('empty'))}</section>`;return heading('notifications')+`<section class="panel"><p>${esc(t('noticeSample'))}</p><div class="note">${esc(t('sampleOnly'))}</div></section>`;}
function learning(){return heading('myLearning')+`<div class="info">${esc(t('studentNote'))}</div><section class="panel">${rows(C.visible(state,actor).filter(w=>w.owner===actor))}<div class="note">${esc(t('progressNote'))}</div></section>`;}
function ai(){const ws=C.visible(state,actor);return heading('ai',t('aiIntro'))+`<div class="grid"><section class="panel">${rows(ws)}<div class="note">${esc(t(state.config.assistantEnabled?'aiCannotDecide':'assistantOff'))}</div></section><aside class="panel"><h2>${esc(t('evidence'))}</h2><p class="muted small" style="margin-top:12px">${esc(t('agentLimits'))}</p></aside></div>`;}
function help(){return heading('helpTitle')+`<div class="grid"><section class="panel"><ul class="help">${['helpOne','helpTwo','helpThree','helpFour','helpFive'].map(k=>`<li>${esc(t(k))}</li>`).join('')}</ul></section><aside class="panel"><h2>${esc(t('limitations'))}</h2><p class="muted small" style="margin-top:12px">${esc(t('limitText'))}</p></aside></div>`;}
function content(){if(['dashboard','workspace'].includes(page))return home();if(page==='detail')return detail();if(page==='new')return create();if(page==='work')return list();if(!C.hasModule(actor,page))return denied();const map={accounts:accountsView,permissions:matrix,organization,sources,agents,settings,changes,incidents,history,audit:history,sharedInfo,notifications,myLearning:learning,ai,help};return map[page]?map[page]():list();}
function clock(){document.querySelectorAll('time.clock').forEach(e=>{e.textContent=new Intl.DateTimeFormat(lang==='zh'?'zh-CN':lang==='en'?'en-GB':'vi-VN',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());e.dateTime=new Date().toISOString();});}
function render(preserve=false){let values=[];if(preserve)values=Array.from(document.querySelectorAll('input[id],textarea[id],select[id]')).filter(e=>e.id!=='language').map(e=>({id:e.id,value:e.value,checked:e.checked}));document.documentElement.lang=lang==='zh'?'zh-CN':lang;$('#app').innerHTML=actor?shell(content()):login();values.forEach(v=>{const e=document.getElementById(v.id);if(e){e.value=v.value;if(e.type==='checkbox')e.checked=v.checked;}});bind();clock();}
function go(p){page=p;render();window.scrollTo(0,0);}
function bind(){if($('#language'))$('#language').onchange=e=>{lang=e.target.value;render(true);};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));
 if($('#login-form'))$('#login-form').onsubmit=e=>{e.preventDefault();actor=$('#account').value;selected=null;go(cfg().home);};
 if($('#create-form'))$('#create-form').onsubmit=e=>{e.preventDefault();const data={title:$('#work-title').value,purpose:$('#purpose').value,criteria:$('#criteria').value,deadline:$('#deadline').value};if(run('create',data)){selected=state.works.at(-1).id;go('detail');}};
 if($('#edit-form'))$('#edit-form').onsubmit=e=>{e.preventDefault();run('edit',{id:selected,text:$('#product-text').value});};
 if($('#decision-form'))$('#decision-form').onsubmit=e=>{e.preventDefault();run(e.submitter.value,{id:selected,note:$('#decision-note').value,checked:$('#checked')?.checked||false});};
 if($('#assign-form'))$('#assign-form').onsubmit=e=>{e.preventDefault();run('assign',{id:selected,target:$('#assign-target').value,note:$('#assign-note').value});};
 if($('#source-form'))$('#source-form').onsubmit=e=>{e.preventDefault();run('source',{name:$('#source-name').value,owner:$('#source-owner').value,authority:$('#source-authority').value},'sourceRegistered');};
 if($('#settings-form'))$('#settings-form').onsubmit=e=>{e.preventDefault();const v={language:$('#default-language').value,assistantEnabled:$('#assistant-mode').value==='on'};if(run('settingsDraft',v))go('changes');};
 if($('#proposal-form'))$('#proposal-form').onsubmit=e=>{e.preventDefault();run('accessProposal',{target:$('#proposal-target').value,role:$('#proposal-role').value,reason:$('#proposal-reason').value},'proposalSent');};
 if($('#incident-form'))$('#incident-form').onsubmit=e=>{e.preventDefault();run('incident',{text:$('#incident-text').value});};
 if($('#unit-form'))$('#unit-form').onsubmit=e=>{e.preventDefault();run('organizationDraft',{name:$('#unit-name').value,parent:$('#unit-parent').value});};
 document.onkeydown=e=>{if(e.key==='Escape'&&$('.directory'))$('.directory').open=false;};
}
function download(data,name){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function action(type,id){if(type==='logout'){actor=null;page='';selected=null;render();}else if(type==='go')go(id);else if(type==='open'){selected=id;go('detail');}else if(type==='new')go('new');else if(type==='submit')run('submit',{id});
 else if(type==='prepare'){const w=state.works.find(w=>w.id===id);if(!w||!C.actions(actor,w).includes('edit'))return alert('noAccess');if(!state.config.assistantEnabled)return alert('assistantOff');const value=[text(w,'title'),'',t('purpose')+': '+text(w,'purpose'),'',t('criteria')+': '+text(w,'criteria'),'',t('sampleProduct'),'',t('aiCannotDecide')].join('\n');run('edit',{id,text:value,source:'template'});}
 else if(type==='applyConfig'){if(run('settingsApply',{id},'settingChanged')){lang=state.config.language;render();}}
 else if(type==='export'||type==='backup'){if(type==='backup'&&account().role!=='admin')return alert('noAccess');const data={schemaVersion:2,kind:'scoped-preview-export',time:new Date().toISOString(),actor,role:account().role,scope:account().scopeKey,works:C.visible(state,actor),notice:t('backupNote')};if(type==='backup'){data.config=state.config;data.organization=state.organization;data.sources=state.sources;data.changes=state.changes;data.proposals=state.proposals;data.incidents=state.incidents;}download(data,'ACI_OS1-'+account().role+'-preview.json');}
}
load();render();setInterval(clock,1000);
})();
</script></body></html>
